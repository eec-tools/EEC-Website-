# The EEC Social Engine clock: every 15 minutes it asks the backend to sync posts with Buffer,
# schedule newly approved posts, mark missed slots and send approval reminders.
# Needs repository secret CRON_SECRET (same value as the backend's CRON_SECRET env var).
name: Social clock

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: social-clock
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKEND_URL: ${{ vars.SOCIAL_BACKEND_URL || 'https://eec-website-backend.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is not set"; exit 1; fi
          code=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$BACKEND_URL/api/social/cron")
          cat response.json; echo
          test "$code" = "200"
